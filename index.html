const t=(k,v={})=>T[LANG][k].replace(/\{(\w+)\}/g,(_,x)=>v[x]??"");

const blank=()=>({step:0,mode:"flow",svc:null,pkg:null,n:1,date:null,time:null,loc:"studio",area:"in",addr:"",name:"",wa:"",note:"",pay:"qris",month:0,avMonth:0,avSel:null,errs:{},booking:null,busy:false});
let S=blank();
const svc=()=>svcById(S.svc), pkg=()=>svc()?.pk.find(p=>p.id===S.pkg);
const totalMin=()=>(pkg()?.m||0)+EXTRA_MIN*(S.n-1);
const minLen=()=>Math.min(...svc().pk.map(p=>p.m));
const prices=()=>{const p=pkg();const sub=p.p+svc().extra*(S.n-1);const tr=S.loc==="home"?TRANSPORT[S.area]:0;const tot=sub+tr;const dp=Math.ceil(tot/2/1000)*1000;return{sub,tr,tot,dp,rem:tot-dp}};
const locText=()=>S.loc==="studio"?t("studioAddr"):S.addr+" ("+(S.area==="in"?t("inCity"):t("outCity"))+")";

const view=document.getElementById("view"),next=document.getElementById("nextBtn"),back=document.getElementById("backBtn"),bar=document.getElementById("bar");
document.getElementById("langslot").append(langToggle(render));
document.getElementById("home").onclick=e=>{e.preventDefault();S=blank();render();scrollTo(0,0)};
const go=st=>{S.step=st;render();scrollTo(0,0)};

function render(){
  document.getElementById("tagline").textContent=t("tagline");
  document.getElementById("foot").innerHTML=t("foot");
  back.setAttribute("aria-label",t("back"));
  const N=6, inFlow=S.step>=1&&S.step<=N&&S.mode==="flow";
  document.getElementById("prog").innerHTML=inFlow?`<div class="progress">${Array.from({length:N},(_,i)=>`<i class="${i<S.step?"on":""}"></i>`).join("")}</div><div class="stepno">${t("step",{a:S.step,b:N})}</div>`:"";
  bar.hidden=!inFlow&&S.mode!=="avail"; back.hidden=false;
  next.hidden=false; next.textContent=t("next"); next.disabled=false;
  if(S.mode==="avail") return avail();
  ({0:home,1:s1,2:s2,3:s3,4:s4,5:s5,6:s6,7:s7})[S.step]();
}

function home(){
  bar.hidden=true;
  view.innerHTML=`<h1 class="hero">${t("homeT")}</h1><p class="sub">${t("homeD")}</p>
  <div class="opts">
   <button class="opt primary" id="b1"><span class="ico">💄</span><span class="grow"><div class="t">${t("bookNow")}</div><div class="d">${t("bookNowD")}</div></span><span>→</span></button>
   <button class="opt" id="b2"><span class="ico">📅</span><span class="grow"><div class="t">${t("checkAv")}</div><div class="d">${t("checkAvD")}</div></span><span>→</span></button>
  </div>`;
  view.querySelector("#b1").onclick=()=>go(1);
  view.querySelector("#b2").onclick=()=>{S.mode="avail";render();scrollTo(0,0)};
}

/* Availability-only calendar: no service needed, browse 12 months */
function avail(){
  const db=load(), base=new Date(TODAY.getFullYear(),TODAY.getMonth()+S.avMonth,1);
  const grid=monthGrid(base,(ds,d)=>{const st=dayStatus(ds,db);const past=st==="past";
    return `<button class="day ${st==="full"?"st-full":""} ${ds===iso(TODAY)?"today":""}" data-ds="${ds}" ${past?"disabled":""} aria-pressed="${S.avSel===ds}">${d}${past?"":`<i class="dot ${st==="open"?"ok":st==="limited"?"warn":"full"}"></i>`}</button>`});
  let panel=`<p class="hint">${t("avPick")}</p>`;
  if(S.avSel){const st=dayStatus(S.avSel,db);const n=READY_SLOTS.filter(h=>readyFree(S.avSel,h,90,db)).length;
    panel=`<div class="card" style="margin-top:14px"><div style="font-weight:700">${fmtDate(S.avSel)}</div><p class="hint" style="margin:6px 0 ${st==="full"?0:12}px">${st==="open"?t("avDayOpen"):st==="limited"?t("avDayLim",{n}):t("avDayFull")}</p>
      ${st==="full"?"":`<button class="btn" id="bookThis" style="width:100%">${t("bookThis")}</button>`}</div>`;}
  view.innerHTML=`<h1>${t("avT")}</h1><p class="sub">${t("avD")}</p>
   <div class="cal"><div class="calhead"><button class="nav" id="pm" ${S.avMonth===0?"disabled":""} aria-label="prev">‹</button><b>${monthName(base)}</b><button class="nav" id="nm" ${S.avMonth>=11?"disabled":""} aria-label="next">›</button></div>${grid}
   <div class="legend"><span><i class="dot ok"></i>${t("avOpen")}</span><span><i class="dot warn"></i>${t("avLim")}</span><span><i class="dot full"></i>${t("avFull")}</span></div></div>${panel}`;
  view.querySelector("#pm").onclick=()=>{S.avMonth--;render()};
  view.querySelector("#nm").onclick=()=>{S.avMonth++;render()};
  view.querySelectorAll(".day:not(:disabled)").forEach(b=>b.onclick=()=>{S.avSel=b.dataset.ds;render()});
  const bt=view.querySelector("#bookThis"); if(bt) bt.onclick=()=>{S.mode="flow";S.date=S.avSel;S.month=S.avMonth;go(1)};
  next.textContent=t("bookNow"); next.onclickAvail=true;
}

function s1(){
  view.innerHTML=`<h1>${t("s1")}</h1><p class="sub">${t("s1d")}</p><div class="opts">${SERVICES.map(s=>`
   <button class="opt" data-v="${s.id}" aria-pressed="${S.svc===s.id}"><span class="ico">${s.ico}</span><span class="grow"><div class="t">${s.n[LANG]}</div><div class="d">${s.d[LANG]}</div></span></button>`).join("")}</div>`;
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(S.svc!==b.dataset.v){S.svc=b.dataset.v;S.pkg=null;S.time=null;if(S.date&&!dayOpenFor(S.date,minLen()))S.date=null}go(2)});
  next.disabled=!S.svc;
}
function s2(){
  const db=load(), base=new Date(TODAY.getFullYear(),TODAY.getMonth()+S.month,1), len=minLen();
  const grid=monthGrid(base,(ds,d)=>{const past=fromIso(ds)<=TODAY, open=dayOpenFor(ds,len,db);
    return `<button class="day" data-ds="${ds}" ${open?"":"disabled"} aria-pressed="${S.date===ds}">${d}${!open&&!past?`<span class="full">${t("full")}</span>`:""}</button>`});
  view.innerHTML=`<h1>${t("s2")}</h1><p class="sub">${t("s2d")}</p>
   <div class="cal"><div class="calhead"><button class="nav" id="pm" ${S.month===0?"disabled":""} aria-label="prev">‹</button><b>${monthName(base)}</b><button class="nav" id="nm" ${S.month>=11?"disabled":""} aria-label="next">›</button></div>${grid}</div>`;
  view.querySelector("#pm").onclick=()=>{S.month--;render()};
  view.querySelector("#nm").onclick=()=>{S.month++;render()};
  view.querySelectorAll(".day:not(:disabled)").forEach(b=>b.onclick=()=>{S.date=b.dataset.ds;S.time=null;go(3)});
  next.disabled=!S.date;
}
function s3(){
  const s=svc(); if(s.pk.length===1&&!S.pkg) S.pkg=s.pk[0].id;
  view.innerHTML=`<h1>${t("s3")}</h1><p class="sub">${s.n[LANG]} · ${fmtDate(S.date)}<br>${t("s3d")}</p><div class="opts">${s.pk.map(p=>`
   <button class="opt" data-v="${p.id}" aria-pressed="${S.pkg===p.id}"><span class="grow"><div class="t">${p.n[LANG]}</div><div class="d">${p.d[LANG]} · ±${durTxt(p.m)}</div></span><span class="price">${rp(p.p)}</span></button>`).join("")}</div>
   <div class="stepper"><div><div style="font-weight:600">${t("people")}</div><div style="font-size:13px;color:var(--muted)">${t("peopleD")} · ${t("extra",{x:rp(s.extra)})}</div></div>
   <div class="ctl"><button id="mn" aria-label="minus" ${S.n<=1?"disabled":""}>−</button><output>${S.n}</output><button id="pl" aria-label="plus" ${S.n>=6?"disabled":""}>+</button></div></div>`;
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.pkg=b.dataset.v;S.time=null;render()});
  view.querySelector("#mn").onclick=()=>{S.n--;S.time=null;render()};
  view.querySelector("#pl").onclick=()=>{S.n++;S.time=null;render()};
  next.disabled=!S.pkg;
}
function s4(){
  const db=load(), len=totalMin(), any=READY_SLOTS.some(h=>readyFree(S.date,h,len,db));
  view.innerHTML=`<h1>${t("s4")}</h1><p class="sub">${fmtDate(S.date)}<br>${t("s4d",{d:durTxt(len)})}</p>
   <div class="slots">${READY_SLOTS.map(h=>`<button class="slot" data-h="${h}" ${readyFree(S.date,h,len,db)?"":"disabled"} aria-pressed="${S.time===h}">${hm(h*60)}</button>`).join("")}</div>
   <p class="hint">${S.time!=null?"✓ "+t("until",{t:hm(S.time*60)}):t("s4h")}</p>`;
  view.querySelectorAll(".slot:not(:disabled)").forEach(b=>b.onclick=()=>{S.time=+b.dataset.h;render()});
  next.disabled=S.time==null||!any;
}
function s5(){
  const e=S.errs;
  view.innerHTML=`<h1>${t("s5")}</h1><div class="label">${t("loc")}</div>
   <div class="opts">
    <button class="opt" data-l="studio" aria-pressed="${S.loc==="studio"}"><span class="ico">🏠</span><span class="grow"><div class="t">${t("studio")}</div><div class="d">${t("studioD")}</div></span></button>
    <button class="opt" data-l="home" aria-pressed="${S.loc==="home"}"><span class="ico">🚗</span><span class="grow"><div class="t">${t("home")}</div><div class="d">${t("homeD")}</div></span></button>
   </div>
   ${S.loc==="home"?`<div class="label">${t("area")}</div><div class="opts" style="grid-template-columns:1fr 1fr">
    <button class="opt" data-a="in" aria-pressed="${S.area==="in"}"><span class="grow"><div class="t">${t("inCity")}</div><div class="d">+${rp(TRANSPORT.in)}</div></span></button>
    <button class="opt" data-a="out" aria-pressed="${S.area==="out"}"><span class="grow"><div class="t">${t("outCity")}</div><div class="d">+${rp(TRANSPORT.out)}</div></span></button></div>
    <div class="field" style="margin-top:14px"><label for="f-addr">${t("address")}</label><textarea id="f-addr" placeholder="${t("addressPh")}">${esc(S.addr)}</textarea>${e.addr?`<span class="err">${t("errAddr")}</span>`:""}</div>`:""}
   <div class="label">${t("you")}</div>
   <div class="field"><label for="f-name">${t("name")}</label><input id="f-name" autocomplete="name" placeholder="${t("namePh")}" value="${esc(S.name)}">${e.name?`<span class="err">${t("errName")}</span>`:""}</div>
   <div class="field"><label for="f-wa">${t("wa")}</label><input id="f-wa" inputmode="tel" autocomplete="tel" placeholder="${t("waPh")}" value="${esc(S.wa)}">${e.wa?`<span class="err">${t("errWa")}</span>`:""}</div>
   <div class="field"><label for="f-note">${t("note")}</label><textarea id="f-note" placeholder="${t("notePh")}">${esc(S.note)}</textarea></div>`;
  const bind=(id,k)=>{const el=view.querySelector(id);if(el) el.oninput=()=>S[k]=el.value};
  bind("#f-addr","addr");bind("#f-name","name");bind("#f-wa","wa");bind("#f-note","note");
  view.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{S.loc=b.dataset.l;render()});
  view.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{S.area=b.dataset.a;render()});
}
function valid5(){const d=S.wa.replace(/\D/g,"");S.errs={name:!S.name.trim(),wa:!/^(0|62)8\d{7,11}$/.test(d),addr:S.loc==="home"&&!S.addr.trim()};return !S.errs.name&&!S.errs.wa&&!S.errs.addr}

function qrSvg(){
  const r=rnd(98321),n=25,c=[];
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const inF=(x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16);if(!inF&&r()<.48)c.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`)}
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-label="QRIS">${c.join("")}${f(0,0)}${f(18,0)}${f(0,18)}</svg>`;
}
const PAY={qris:"QRIS",bank:"Transfer BCA",ewallet:"GoPay / OVO"};
function s6(){
  const s=svc(),p=pkg(),pr=prices();
  view.innerHTML=`<h1>${t("s6")}</h1><p class="sub">${t("s6d")}</p>
   <div class="card">
    <div class="row"><span>${t("service")}</span><span>${s.n[LANG]}</span></div>
    <div class="row"><span>${t("pkg")}</span><span>${p.n[LANG]}</span></div>
    <div class="row"><span>${t("date")}</span><span>${fmtDate(S.date)}</span></div>
    <div class="row"><span>${t("time")}</span><span>${hm(S.time*60)}</span></div>
    <div class="row"><span>${t("location")}</span><span>${esc(locText())}</span></div>
    <div class="row total"><span>${t("subtotal",{n:S.n})}</span><span>${rp(pr.sub)}</span></div>
    ${pr.tr?`<div class="row"><span>${t("transport")}</span><span>${rp(pr.tr)}</span></div>`:""}
    <div class="row"><span>${t("total")}</span><span>${rp(pr.tot)}</span></div>
    <div class="row"><span>${t("remain")}</span><span>${rp(pr.rem)}</span></div>
   </div>
   <div class="due"><span>${t("dueNow")}</span><b>${rp(pr.dp)}</b></div>
   <div class="label">${t("method")}</div>
   <div class="paygrid">${Object.entries(PAY).map(([k,n])=>`<button class="paym" data-p="${k}" aria-pressed="${S.pay===k}">${n}</button>`).join("")}</div>
   ${S.pay==="qris"?`<div class="qr">${qrSvg()}<span class="hint" style="margin:0">${t("qrisD")}</span></div>`:
     S.pay==="bank"?`<div class="bank card">${t("bankD")}<br><code>${BIZ.bank}</code></div>`:`<div class="bank card">GoPay / OVO<br><code>${BIZ.wa}</code></div>`}
   <p class="hint" style="text-align:center">🔒 ${t("fake")}</p>`;
  view.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.pay=b.dataset.p;render()});
  next.textContent=t("pay",{x:rp(pr.dp)});
  if(S.busy){next.innerHTML=`<span class="spin"></span> ${t("paying")}`;next.disabled=true}
}

/* Save the paid booking so it shows up on the admin page and blocks the slot */
function saveBooking(){
  const db=load(), s=svc(), p=pkg(), pr=prices(), len=totalMin(), ready=S.time*60;
  const items=[{d:`${s.n.id} – ${p.n.id}`,q:1,p:p.p}];
  if(S.n>1) items.push({d:"Orang tambahan",q:S.n-1,p:s.extra});
  if(pr.tr) items.push({d:"Transport "+(S.area==="in"?"dalam kota":"luar kota"),q:1,p:pr.tr});
  const b={id:"b"+Date.now(),code:newCode(db),src:"online",date:S.date,start:ready-len,end:ready,ready,name:S.name.trim(),wa:S.wa.trim(),svc:s.id,
    label:{id:`${s.n.id} – ${p.n.id}`,en:`${s.n.en} – ${p.n.en}`},people:S.n,loc:S.loc==="studio"?"Studio Shimmernaya":S.addr.trim()+" ("+(S.area==="in"?"dalam kota":"luar kota")+")",
    note:S.note.trim(),items,discount:0,dp:pr.dp,payMethod:PAY[S.pay],inv:"review",created:new Date().toISOString()};
  db.bookings.push(b); save(db); return b;
}

function s7(){
  bar.hidden=true;
  const b=S.booking, s=svc(), p=pkg(), pr=prices(), len=totalMin();
  const v={name:b.name,wa:b.wa,svc:s.n[LANG],pkg:p.n[LANG],n:S.n,date:fmtDate(S.date),ready:hm(b.ready),start:hm(b.start),dur:durTxt(len),loc:locText(),dp:rp(pr.dp),rem:rp(pr.rem),code:b.code,note:b.note||t("noNote"),method:b.payMethod};
  const now=new Date(),clock=pad(now.getHours())+"."+pad(now.getMinutes());
  const invUrl="admin.html#inv-"+b.code;
  view.innerHTML=`<div class="done"><div class="tick">✓</div><h1>${t("doneT")}</h1><p class="sub">${t("doneD",{n:esc(v.name),w:esc(v.wa)})}</p>
   <div class="card" style="display:inline-block;padding:10px 18px">${t("code")}: <b>${b.code}</b></div></div>
   <section class="demo"><h2>${t("demoClient")}</h2><div class="wa"><div class="hd"><div class="av">💄</div><div class="nm">Shimmernaya<small>Business account</small></div></div>
    <div class="body"><div class="bub">${esc(t("waClient",v))}<span class="tm">${clock}</span></div></div></div></section>
   <section class="demo"><h2>${t("demoArtist")}</h2><div class="wa"><div class="hd"><div class="av">🔔</div><div class="nm">Booking Bot<small>${LANG==="id"?"Notifikasi otomatis":"Automatic alert"}</small></div></div>
    <div class="body"><div class="bub">${esc(t("waArtist",v))}<span class="tm">${clock}</span></div>
    <div class="bub">${esc(t("invReady",{inv:invNo(b)}))}\n<a href="${invUrl}">${t("openInv")} →</a><span class="tm">${clock}</span></div></div></div></section>
   <section class="demo"><h2>${t("demoCal")}</h2><div class="ev"><div class="strip"></div><div style="min-width:0">
    <div class="t">💄 ${esc(v.svc)} – ${esc(v.name)} (${S.n})</div>
    <div class="m">${v.date} · ${v.start} – ${v.ready}</div><div class="m">📍 ${esc(v.loc)}</div><div class="m">${b.code}</div></div></div></section>
   <a class="btn" href="${invUrl}" style="display:block;margin-top:22px">📄 ${t("openInv")}</a>
   <button class="again" id="again">↺ ${t("again")}</button>`;
  view.querySelector("#again").onclick=()=>{S=blank();render();scrollTo(0,0)};
}

next.onclick=()=>{
  if(S.mode==="avail"){S.mode="flow";if(S.avSel&&dayStatus(S.avSel)!=="full"){S.date=S.avSel;S.month=S.avMonth}go(1);return}
  if(S.step===5&&!valid5()){render();return}
  if(S.step===6){S.busy=true;render();setTimeout(()=>{S.busy=false;S.booking=saveBooking();go(7)},1600);return}
  go(S.step+1);
};
back.onclick=()=>{if(S.mode==="avail"){S.mode="flow";go(0);return}S.errs={};go(S.step-1)};
render();
</script>

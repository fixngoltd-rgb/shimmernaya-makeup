<title>Shimmernaya Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: single narrow column, one decision per screen, sticky bottom action bar */
:root{
  --bg:#FBF6F8; --surface:#FFFFFF; --ink:#2A1A24; --muted:#7A6670; --line:#EADDE2;
  --accent:#9C2F55; --accent-ink:#FFFFFF; --accent-soft:#F7E4EB; --ok:#1F7A4D; --ok-soft:#E3F3EA;
  --off:#C9BCC2; --off-bg:#F3EEF0;
  --display:"Bodoni Moda", "Didot", Georgia, serif;
  --body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* WhatsApp mock colours stay fixed in both themes */
  --wa-head:#075E54; --wa-bg:#EFE7DD; --wa-out:#D9FDD3; --wa-in:#FFFFFF; --wa-ink:#111B21; --wa-meta:#667781;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17101A; --surface:#221923; --ink:#F4E9EE; --muted:#B39CA7; --line:#3A2B34;
  --accent:#E57EA3; --accent-ink:#22101A; --accent-soft:#3B2130; --ok:#5BC98E; --ok-soft:#1E3529;
  --off:#5A4852; --off-bg:#1F1720; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#17101A; --surface:#221923; --ink:#F4E9EE; --muted:#B39CA7; --line:#3A2B34;
  --accent:#E57EA3; --accent-ink:#22101A; --accent-soft:#3B2130; --ok:#5BC98E; --ok-soft:#1E3529;
  --off:#5A4852; --off-bg:#1F1720; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:480px;margin:0 auto;padding-inline:18px;padding-block:14px 120px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-style:italic;font-size:22px;letter-spacing:.2px}
.brand small{display:block;font-family:var(--body);font-style:normal;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.demo-tag{font-size:10px;color:var(--muted);text-align:right;margin-top:4px}

.progress{display:flex;gap:4px;margin-top:18px}
.progress i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--accent)}
.stepno{font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}

h1{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.15;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px}

.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .ico{font-size:24px;width:32px;text-align:center;flex:none}
.opt .t{font-weight:600}
.opt .d{font-size:13px;color:var(--muted)}
.opt .grow{flex:1;min-width:0}
.price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-weight:600}
.nav{border:1px solid var(--line);background:none;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:16px}
.nav:disabled{opacity:.3;cursor:default}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:11px;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;background:none;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.day:hover:not(:disabled){background:var(--accent-soft)}
.day:disabled{color:var(--off);cursor:not-allowed;text-decoration:line-through}
.day .full{font-size:8px;font-weight:600;text-decoration:none;letter-spacing:.03em}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}

.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:18px}
.stepper .ctl{display:flex;align-items:center;gap:14px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:none;font-size:20px;cursor:pointer}
.stepper button:disabled{opacity:.3}
.stepper output{font-size:20px;font-weight:700;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 8px}

.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 0;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.slot:hover:not(:disabled){border-color:var(--accent)}
.slot:disabled{background:var(--off-bg);color:var(--off);border-color:transparent;text-decoration:line-through;cursor:not-allowed}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{font-size:13px;color:var(--muted);margin-top:12px}

.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:14px}
.field input,.field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:inherit;color:var(--ink)}
.field textarea{min-height:80px;resize:vertical}
.err{color:#C4314B;font-size:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px}
.row span:first-child{color:var(--muted)}
.row span:last-child{text-align:right;font-weight:600;min-width:0}
.row.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;font-size:15px}
.due{display:flex;justify-content:space-between;align-items:baseline;background:var(--accent-soft);border-radius:14px;padding:14px 16px;margin-top:12px}
.due b{font-size:22px;font-variant-numeric:tabular-nums}
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paym{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 4px;font-weight:600;font-size:13px;cursor:pointer}
.paym[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qr{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px}
.qr svg{background:#fff;padding:10px;border-radius:12px;width:170px;height:170px}
.bank{margin-top:14px;font-size:14px}
.bank code{font-size:17px;font-weight:700;letter-spacing:.05em}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:444px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:16px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.back{flex:none;width:56px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer;font-size:18px}

.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-3px}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}

.done{text-align:center;padding-top:10px}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:32px;margin:0 auto 10px}
.demo{border:1.5px dashed var(--line);border-radius:18px;padding:14px;margin-top:22px}
.demo h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.wa{border-radius:14px;overflow:hidden;background:var(--wa-bg)}
.wa .hd{background:var(--wa-head);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.wa .av{width:32px;height:32px;border-radius:50%;background:#ffffff33;display:grid;place-items:center;font-size:15px}
.wa .nm{font-weight:600;font-size:14px;line-height:1.2}
.wa .nm small{display:block;font-weight:400;opacity:.8;font-size:11px}
.wa .body{padding:12px}
.bub{max-width:88%;padding:8px 10px 18px;border-radius:10px;font-size:13.5px;line-height:1.45;color:var(--wa-ink);white-space:pre-wrap;position:relative;box-shadow:0 1px .5px #0002;word-wrap:break-word}
.bub.in{background:var(--wa-in);border-top-left-radius:2px}
.bub .tm{position:absolute;right:8px;bottom:3px;font-size:10px;color:var(--wa-meta)}
.ev{display:flex;gap:12px;background:var(--surface);border-radius:12px;padding:12px;border:1px solid var(--line)}
.ev .strip{width:4px;border-radius:2px;background:var(--accent);flex:none}
.ev .t{font-weight:700}
.ev .m{font-size:13px;color:var(--muted)}
.again{margin-top:22px;background:none;border:1.5px solid var(--line);border-radius:14px;padding:13px;width:100%;font-weight:600;cursor:pointer}
</style>
</head>

const t=(k,v={})=>T[L][k].replace(/\{(\w+)\}/g,(_,x)=>v[x]??"");

function rnd(seed){let x=seed%2147483647;return()=> (x=x*16807%2147483647)/2147483647}
const busyCache={};

  const r=rnd(d.getFullYear()*400+d.getMonth()*32+d.getDate()+7);
  const out=[]; const wk=d.getDay()===0||d.getDay()===6;
  if(r()<(wk?.22:.08)) out.push([4*60,DAY_END*60]); // fully booked day (wedding season weekends)
  else{const c=r()<.35?0:(r()<.55?1:2);
    for(let i=0;i<c;i++){const s=(6+Math.floor(r()*9))*60,e=s+(2+Math.floor(r()*3))*60;out.push([s,e]);}}
  return busyCache[k]=out;
}
function slotFree(d,h,len){ // h = ready-by hour; makeup runs back from it
  const e=h*60,s=e-len; if(s<EARLIEST||e>DAY_END*60) return false;
  return !busy(d).some(([a,b])=>s<b+BUFFER && e>a-BUFFER);
}
function dayOpen(d,len){ if(d<=today) return false; return SLOTS.some(h=>slotFree(d,h,len)); }
const minLen=()=>Math.min(...svc().pk.map(p=>p.m));

const prices=()=>{const p=pkg();const sub=p.p+svc().extra*(S.n-1);const tr=S.loc==="home"?TRANSPORT[S.area]:0;const tot=sub+tr;const dp=Math.ceil(tot/2/1000)*1000;return{sub,tr,tot,dp,rem:tot-dp}};
const locText=()=>S.loc==="studio"?t("studioAddr"):S.addr+" ("+(S.area==="in"?t("inCity"):t("outCity"))+")";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const view=document.getElementById("view"),next=document.getElementById("nextBtn"),back=document.getElementById("backBtn"),bar=document.getElementById("bar");

function render(){
  document.documentElement.lang=L;
  document.getElementById("tagline").textContent=t("tagline");
  document.getElementById("demotag").textContent=t("demotag");
  back.setAttribute("aria-label",t("back"));
  const N=6;
  document.getElementById("prog").innerHTML=S.step<=N?`<div class="progress">${Array.from({length:N},(_,i)=>`<i class="${i<S.step?"on":""}"></i>`).join("")}</div><div class="stepno">${t("step",{a:S.step,b:N})}</div>`:"";
  bar.hidden=S.step>N; back.hidden=S.step===1;
  next.textContent=t("next"); next.disabled=false;
  ({1:s1,2:s2,3:s3,4:s4,5:s5,6:s6,7:s7})[S.step]();
}

function s1(){
  view.innerHTML=`<h1>${t("s1")}</h1><p class="sub">${t("s1d")}</p><div class="opts">${SERVICES.map(s=>`
   <button class="opt" data-v="${s.id}" aria-pressed="${S.svc===s.id}"><span class="ico">${s.ico}</span><span class="grow"><div class="t">${s.n[L]}</div><div class="d">${s.d[L]}</div></span></button>`).join("")}</div>`;
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(S.svc!==b.dataset.v){S.svc=b.dataset.v;S.pkg=null;S.date=null;S.time=null}S.step=2;render();scrollTo(0,0)});
  next.disabled=!S.svc;
}

function s2(){
  const base=new Date(today.getFullYear(),today.getMonth()+S.month,1);
  const first=(base.getDay()+6)%7, days=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  const dows=L==="id"?["Sen","Sel","Rab","Kam","Jum","Sab","Min"]:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const len=minLen(); let cells="";
  for(let i=0;i<first;i++) cells+="<span></span>";
  for(let d=1;d<=days;d++){
    const dt=new Date(base.getFullYear(),base.getMonth(),d); const past=dt<=today; const open=dayOpen(dt,len);
    const sel=S.date&&key(S.date)===key(dt);
    cells+=`<button class="day" data-d="${d}" ${open?"":"disabled"} aria-pressed="${!!sel}">${d}${!open&&!past?`<span class="full">${t("full")}</span>`:""}</button>`;
  }
  view.innerHTML=`<h1>${t("s2")}</h1><p class="sub">${t("s2d")}</p>
   <div class="cal"><div class="calhead"><button class="nav" id="pm" ${S.month===0?"disabled":""} aria-label="prev">‹</button><b>${base.toLocaleDateString(L==="id"?"id-ID":"en-GB",{month:"long",year:"numeric"})}</b><button class="nav" id="nm" ${S.month>=5?"disabled":""} aria-label="next">›</button></div>
   <div class="grid7">${dows.map(x=>`<span class="dow">${x}</span>`).join("")}${cells}</div></div>`;
  view.querySelector("#pm").onclick=()=>{S.month--;render()};
  view.querySelector("#nm").onclick=()=>{S.month++;render()};
  view.querySelectorAll(".day:not(:disabled)").forEach(b=>b.onclick=()=>{S.date=new Date(base.getFullYear(),base.getMonth(),+b.dataset.d);S.time=null;S.step=3;render();scrollTo(0,0)});
  next.disabled=!S.date;
}

function s3(){
  const s=svc(); if(s.pk.length===1&&!S.pkg) S.pkg=s.pk[0].id;
  view.innerHTML=`<h1>${t("s3")}</h1><p class="sub">${s.n[L]} · ${fmtDate(S.date)}<br>${t("s3d")}</p><div class="opts">${s.pk.map(p=>`
   <button class="opt" data-v="${p.id}" aria-pressed="${S.pkg===p.id}"><span class="grow"><div class="t">${p.n[L]}</div><div class="d">${p.d[L]} · ±${dur(p.m)}</div></span><span class="price">${rp(p.p)}</span></button>`).join("")}</div>
   <div class="stepper"><div><div class="t" style="font-weight:600">${t("people")}</div><div class="d" style="font-size:13px;color:var(--muted)">${t("peopleD")} · ${t("extra",{x:rp(s.extra)})}</div></div>
   <div class="ctl"><button id="mn" aria-label="minus" ${S.n<=1?"disabled":""}>−</button><output>${S.n}</output><button id="pl" aria-label="plus" ${S.n>=6?"disabled":""}>+</button></div></div>`;
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.pkg=b.dataset.v;S.time=null;render()});
  view.querySelector("#mn").onclick=()=>{S.n--;S.time=null;render()};
  view.querySelector("#pl").onclick=()=>{S.n++;S.time=null;render()};
  next.disabled=!S.pkg;
}

function s4(){
  const len=totalMin();
  const any=SLOTS.some(h=>slotFree(S.date,h,len));
  view.innerHTML=`<h1>${t("s4")}</h1><p class="sub">${fmtDate(S.date)}<br>${t("s4d",{d:dur(len)})}</p>
   <div class="slots">${SLOTS.map(h=>`<button class="slot" data-h="${h}" ${slotFree(S.date,h,len)?"":"disabled"} aria-pressed="${S.time===h}">${hm(h*60)}</button>`).join("")}</div>
   <p class="hint">${S.time!=null?"✓ "+t("until",{t:hm(S.time*60)}):t("s4h")}</p>`;
  view.querySelectorAll(".slot:not(:disabled)").forEach(b=>b.onclick=()=>{S.time=+b.dataset.h;render()});
  next.disabled=S.time==null||!any;
}

function s5(){
  const e=S.errs;
  view.innerHTML=`<h1>${t("s5")}</h1>
   <div class="label">${t("loc")}</div>
   <div class="opts">
    <button class="opt" data-l="studio" aria-pressed="${S.loc==="studio"}"><span class="ico">🏠</span><span class="grow"><div class="t">${t("studio")}</div><div class="d">${t("studioD")}</div></span></button>
    <button class="opt" data-l="home" aria-pressed="${S.loc==="home"}"><span class="ico">🚗</span><span class="grow"><div class="t">${t("home")}</div><div class="d">${t("homeD")}</div></span></button>
   </div>
   ${S.loc==="home"?`<div class="label">${t("area")}</div><div class="opts" style="grid-template-columns:1fr 1fr">
    <button class="opt" data-a="in" aria-pressed="${S.area==="in"}"><span class="grow"><div class="t">${t("inCity")}</div><div class="d">+${rp(TRANSPORT.in)}</div></span></button>
    <button class="opt" data-a="out" aria-pressed="${S.area==="out"}"><span class="grow"><div class="t">${t("outCity")}</div><div class="d">+${rp(TRANSPORT.out)}</div></span></button></div>
    <div class="field" style="margin-top:14px"><label for="f-addr">${t("address")}</label><textarea id="f-addr" placeholder="${t("addressPh")}">${esc(S.addr)}</textarea>${e.addr?`<span class="err">${t("errAddr")}</span>`:""}</div>`:""}
   <div class="label">${L==="id"?"Data Kakak":"Your details"}</div>
   <div class="field"><label for="f-name">${t("name")}</label><input id="f-name" autocomplete="name" placeholder="${t("namePh")}" value="${esc(S.name)}">${e.name?`<span class="err">${t("errName")}</span>`:""}</div>
   <div class="field"><label for="f-wa">${t("wa")}</label><input id="f-wa" inputmode="tel" autocomplete="tel" placeholder="${t("waPh")}" value="${esc(S.wa)}">${e.wa?`<span class="err">${t("errWa")}</span>`:""}</div>
   <div class="field"><label for="f-note">${t("note")}</label><textarea id="f-note" placeholder="${t("notePh")}">${esc(S.note)}</textarea></div>`;
  const bind=(id,k)=>{const el=view.querySelector(id);if(el) el.oninput=()=>S[k]=el.value};
  bind("#f-addr","addr");bind("#f-name","name");bind("#f-wa","wa");bind("#f-note","note");
  view.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{S.loc=b.dataset.l;render()});
  view.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{S.area=b.dataset.a;render()});
}
function valid5(){
  const d=S.wa.replace(/[^\d]/g,"");
  S.errs={name:!S.name.trim(),wa:!/^(0|62)8\d{7,11}$/.test(d),addr:S.loc==="home"&&!S.addr.trim()};
  return !S.errs.name&&!S.errs.wa&&!S.errs.addr;
}

function qrSvg(){
  const r=rnd(98321),n=25,c=[];
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const inF=(x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16);if(!inF&&r()<.48)c.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`)}
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-label="QRIS">${c.join("")}${finder(0,0)}${finder(18,0)}${finder(0,18)}</svg>`;
}

function s6(){
  const s=svc(),p=pkg(),pr=prices(),len=totalMin();
  view.innerHTML=`<h1>${t("s6")}</h1><p class="sub">${t("s6d")}</p>
   <div class="card">
    <div class="row"><span>${t("service")}</span><span>${s.n[L]}</span></div>
    <div class="row"><span>${t("pkg")}</span><span>${p.n[L]}</span></div>
    <div class="row"><span>${t("date")}</span><span>${fmtDate(S.date)}</span></div>
    <div class="row"><span>${t("time")}</span><span>${hm(S.time*60)}</span></div>
    <div class="row"><span>${t("location")}</span><span>${esc(locText())}</span></div>
    <div class="row total"><span>${t("subtotal",{n:S.n})}</span><span>${rp(pr.sub)}</span></div>
    ${pr.tr?`<div class="row"><span>${t("transport")}</span><span>${rp(pr.tr)}</span></div>`:""}
    <div class="row"><span>${t("total")}</span><span>${rp(pr.tot)}</span></div>
    <div class="row"><span>${t("remain")}</span><span>${rp(pr.rem)}</span></div>
   </div>
   <div class="due"><span>${t("dueNow")}</span><b>${rp(pr.dp)}</b></div>
   <div class="label">${t("method")}</div>
   <div class="paygrid">${[["qris","QRIS"],["bank","Transfer BCA"],["ewallet","GoPay / OVO"]].map(([k,n])=>`<button class="paym" data-p="${k}" aria-pressed="${S.pay===k}">${n}</button>`).join("")}</div>
   ${S.pay==="qris"?`<div class="qr">${qrSvg()}<span class="hint" style="margin:0">${t("qrisD")}</span></div>`:
     S.pay==="bank"?`<div class="bank card">${t("bankD")} BCA<br><code>8270 1234 56</code><br>a.n. Shimmernaya</div>`:
     `<div class="bank card">GoPay / OVO<br><code>0812 3456 7890</code></div>`}
   <p class="hint" style="text-align:center">🔒 ${t("fake")}</p>`;
  view.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.pay=b.dataset.p;render()});
  next.textContent=S.busy?"":t("pay",{x:rp(pr.dp)});
  if(S.busy){next.innerHTML=`<span class="spin"></span> ${t("paying")}`;next.disabled=true}
}

function s7(){
  const s=svc(),p=pkg(),pr=prices(),len=totalMin();
  const mName={qris:"QRIS",bank:"Transfer BCA",ewallet:"GoPay / OVO"}[S.pay];
  const v={name:S.name.trim(),wa:S.wa.trim(),svc:s.n[L],pkg:p.n[L],n:S.n,date:fmtDate(S.date),ready:hm(S.time*60),start:hm(S.time*60-len),dur:dur(len),loc:locText(),dp:rp(pr.dp),rem:rp(pr.rem),code:S.code,note:S.note.trim()||t("noNote"),method:mName};
  const now=new Date(),clock=String(now.getHours()).padStart(2,"0")+"."+String(now.getMinutes()).padStart(2,"0");
  view.innerHTML=`<div class="done"><div class="tick">✓</div><h1>${t("doneT")}</h1><p class="sub">${t("doneD",{n:esc(v.name),w:esc(v.wa)})}</p>
   <div class="card" style="display:inline-block;padding:10px 18px">${t("code")}: <b>${S.code}</b></div></div>
   <section class="demo"><h2>${t("demoClient")}</h2><div class="wa"><div class="hd"><div class="av">💄</div><div class="nm">Shimmernaya<small>Business account</small></div></div>
    <div class="body"><div class="bub in">${esc(t("waClient",v))}<span class="tm">${clock}</span></div></div></div></section>
   <section class="demo"><h2>${t("demoArtist")}</h2><div class="wa"><div class="hd"><div class="av">🔔</div><div class="nm">Booking Bot<small>${L==="id"?"Notifikasi otomatis":"Automatic alert"}</small></div></div>
    <div class="body"><div class="bub in">${esc(t("waArtist",v))}<span class="tm">${clock}</span></div></div></div></section>
   <section class="demo"><h2>${t("demoCal")}</h2><div class="ev"><div class="strip"></div><div style="min-width:0">
    <div class="t">💄 ${esc(v.svc)} – ${esc(v.name)} (${S.n})</div>
    <div class="m">${v.date} · ${v.start} – ${v.ready} (${L==="id"?"siap":"ready"} ${v.ready})</div>
    <div class="m">📍 ${esc(v.loc)}</div>
    <div class="m">${esc(t("calNote",v))} · ${S.code}</div></div></div></section>
   <button class="again" id="again">↺ ${t("again")}</button>`;
  view.querySelector("#again").onclick=()=>{Object.assign(S,{step:1,svc:null,pkg:null,n:1,date:null,time:null,loc:"studio",area:"in",addr:"",name:"",wa:"",note:"",pay:"qris",month:0,errs:{},code:null});render();scrollTo(0,0)};
}

next.onclick=()=>{
  if(S.step===5&&!valid5()){render();return}
  if(S.step===6){
    S.busy=true;render();
    setTimeout(()=>{S.busy=false;S.code="GLW-"+Math.floor(1000+Math.random()*9000);S.step=7;render();scrollTo(0,0)},1600);
    return;
  }
  S.step++;render();scrollTo(0,0);
};
back.onclick=()=>{if(S.step>1){S.step--;S.errs={};render();scrollTo(0,0)}};
const setLang=l=>{L=l;document.getElementById("lang-id").setAttribute("aria-pressed",l==="id");document.getElementById("lang-en").setAttribute("aria-pressed",l==="en");render()};
document.getElementById("lang-id").onclick=()=>setLang("id");
document.getElementById("lang-en").onclick=()=>setLang("en");
render();
</script>
</body>
</html>
